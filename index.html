    <script>
      // Mantener la navegación PWA en pantalla completa en iOS sin abrir la barra de Safari
      (function() {
        if (('standalone' in window.navigator) && window.navigator.standalone) {
          window.addEventListener('click', function(e) {
            var el = e.target;
            while (el && el.nodeName !== 'A') {
              el = el.parentNode;
            }
            if (el && el.nodeName === 'A' && el.href) {
              if (el.href.indexOf(location.host) !== -1 && !el.hasAttribute('target')) {
                e.preventDefault();
                window.location.href = el.href;
              }
            }
          }, true);
        }
      })();
    </script>
